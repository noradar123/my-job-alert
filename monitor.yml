name: Job Alert Monitor

on:
  schedule:
    # UTC 時間,每 6 小時跑一次(台灣時間 UTC+8,對應大約 08:00 / 14:00 / 20:00 / 02:00)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # 允許在 GitHub 網頁上手動點一下馬上跑一次,方便測試

permissions:
  contents: write  # 需要寫入權限才能把 state.json commit 回 repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state.json [skip ci]"
          git push
